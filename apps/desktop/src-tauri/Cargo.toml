[package]
name = "gielinor-companion-desktop"
version = "0.7.0"
description = "Read-only RuneScape 3 companion desktop shell"
authors = ["Gielinor Companion contributors"]
edition = "2021"
rust-version = "1.85"
license = "MIT"

[lib]
name = "gielinor_companion_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-http = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
