name: Stable release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.34.5"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Match tag to package version
        if: github.ref_type == 'tag'
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

      - name: Audit production Node dependencies
        run: pnpm audit --audit-level high

      - name: Run mandatory quality gates
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm test:errors
          pnpm test:resilience
          pnpm test:recovery
          pnpm test:scheduler
          pnpm test:update-checker
          pnpm test:fault-injection
          pnpm test:launcher
          pnpm test:installer
          pnpm test:portable
          pnpm test:release-assets
          pnpm test:provenance
          pnpm test:live-data-ui

      - name: Verify stable release contracts and documentation
        run: |
          pnpm verify:contracts
          pnpm verify:docs
          pnpm test:release

      - name: Exercise clean packed npm installation
        run: pnpm smoke:clean-install

      - name: Prepare npm release archives
        run: pnpm pack:release

      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: release/npm/*.tgz
          if-no-files-found: error

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: gielinor-companion.spdx.json
          artifact-name: gielinor-companion-sbom
          upload-artifact: false
          upload-release-assets: false

      - uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: |
            gielinor-companion.spdx.json
            data/contracts/mcp-tools-v1.json
            data/contracts/mcp-tools-v1.1.json
            data/schemas/profile-export.schema.json
          if-no-files-found: error

  desktop:
    needs: validate
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: windows-x64
            asset_platform: windows
            bundles: nsis,msi
          - platform: macos-latest
            label: macos
            asset_platform: macos
            bundles: dmg
          - platform: ubuntu-22.04
            label: linux-x64
            asset_platform: linux
            bundles: appimage,deb

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and prepare bundled runtime
        run: |
          pnpm build
          pnpm --filter @gielinor/desktop prepare:runtime

      - name: Build native installer
        uses: tauri-apps/tauri-action@v1
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          projectPath: apps/desktop
          args: --bundles ${{ matrix.bundles }}

      - name: Build isolated portable Windows archive
        if: runner.os == 'Windows'
        run: pnpm pack:portable

      - name: Smoke-test clean per-user Windows installation
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/smoke-windows-installer.ps1

      - name: Normalize release asset names
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            node scripts/collect-desktop-assets.mjs --platform windows --portable auto
          else
            node scripts/collect-desktop-assets.mjs --platform ${{ matrix.asset_platform }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}
          path: release/desktop-assets/*
          if-no-files-found: error

  container:
    if: github.ref_type == 'tag'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    env:
      IMAGE_NAME: ghcr.io/dioncroft/gielinor-companion-mcp

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and publish hosted image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Attest container provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Record container digest
        shell: bash
        run: printf '%s@%s\n' "${IMAGE_NAME}" "${{ steps.image.outputs.digest }}" > container-digest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: container-digest
          path: container-digest.txt
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [validate, desktop, container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          path: release/assets
          merge-multiple: true

      - name: Generate release checksums
        run: node scripts/generate-checksums.mjs release/assets

      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-checksums: release/assets/SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: docs/releases/v1.2.0.md
          files: release/assets/**
          fail_on_unmatched_files: true
          generate_release_notes: true
