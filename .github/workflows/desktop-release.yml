name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: nsis
          - platform: macos-latest
            bundles: dmg
          - platform: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build deterministic runtime
        run: pnpm build

      - name: Prepare target sidecar
        run: pnpm --filter @gielinor/desktop prepare:runtime

      - name: Build native bundles
        run: pnpm --filter @gielinor/desktop exec tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: gielinor-companion-${{ matrix.platform }}
          path: apps/desktop/src-tauri/target/release/bundle/
          if-no-files-found: error
