name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            asset_platform: windows
            bundles: nsis,msi
          - platform: macos-latest
            asset_platform: macos
            bundles: dmg
          - platform: ubuntu-22.04
            asset_platform: linux
            bundles: appimage,deb
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build deterministic runtime
        run: pnpm build

      - name: Prepare target sidecar
        run: pnpm --filter @gielinor/desktop prepare:runtime

      - name: Build native bundles
        run: pnpm --filter @gielinor/desktop exec tauri build --bundles ${{ matrix.bundles }}

      - name: Build isolated portable Windows archive
        if: runner.os == 'Windows'
        run: pnpm pack:portable

      - name: Smoke-test clean per-user Windows installation
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/smoke-windows-installer.ps1

      - name: Normalize release asset names
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            node scripts/collect-desktop-assets.mjs --platform windows --portable auto
          else
            node scripts/collect-desktop-assets.mjs --platform ${{ matrix.asset_platform }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: gielinor-companion-${{ matrix.platform }}
          path: release/desktop-assets/*
          if-no-files-found: error
